<main style="flex-grow: 1; min-width: 0; padding: 32px 48px 40px; display: flex; flex-direction: column">

<div style="margin-top: 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px">

<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="height: 40px; border: 0; border-radius: 10px; background: {{t.bg}}; color: {{t.fg}}; font-size: 14px; font-weight: 500; cursor: pointer">{{t.label}}</button>
</sc-for>

<div style="display: flex; align-items: center; gap: 8px">

<span>All dates</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="color: #7B7F87; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<button type="button" style="height: 44px; padding: 0 14px; border: 0; background: transparent; color: #F4F5F7; font-size: 14px; font-weight: 500; cursor: pointer">Select</button>
</div>

<sc-if value="{{showClips}}" hint-placeholder-val="{{ true }}">

</sc-if>
<sc-if value="{{row.isClip}}" hint-placeholder-val="{{ true }}">
<div style="min-width: 0; display: flex; flex-direction: column; gap: 10px">

<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><path d="M12 4v11"></path><path d="M7 10.5l5 5 5-5"></path><path d="M5 20h14"></path></svg>

<span style="position: absolute; left: 8px; bottom: 8px; font-family: 'Geist Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: #D5D7DB; font-variant-numeric: tabular-nums">{{p.time}}</span>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const tab = (this.state && this.state.tab) || 'loop';
    const mk = (id, label) => {
      const on = tab === id;
      return {
        label: label,
        on: on,
        bg: on ? '#F4F5F7' : 'transparent',
        fg: on ? '#050506' : '#9EA1A8',
        pick: () => this.setState({ tab: id })
      };
    };
    const head = (label) => ({ isHeader: true, isClip: false, label: label });
    const clip = (time, duration, size, locked) => ({
      isHeader: false,
      isClip: true,
      time: time,
      duration: duration,
      meta: duration + ' · ' + size,
      locked: locked,
      playLabel: 'Play clip ' + time,
      dlLabel: 'Download clip ' + time
    });
    const loop = [
      head('TODAY'),
      clip('17:41 – 17:42', '1:00', '86 MB', false),
      clip('17:40 – 17:41', '1:00', '86 MB', false),
      clip('17:39 – 17:40', '1:00', '86 MB', false),
      clip('17:38 – 17:39', '1:00', '86 MB', false),
      head('YESTERDAY'),
      clip('08:12 – 08:13', '1:00', '86 MB', false),
      clip('08:11 – 08:12', '1:00', '86 MB', false),
      clip('08:10 – 08:11', '1:00', '86 MB', false),
      clip('08:09 – 08:10', '1:00', '86 MB', false)
    ];
    const incidents = [
      head('TODAY'),
      clip('17:36:14', '0:30', '43 MB', true),
      head('12 SEP'),
      clip('09:05:52', '0:30', '43 MB', true)
    ];
    const ph = (time) => ({ isHeader: false, isPhoto: true, time: time, aria: 'Photo from ' + time });
    const phHead = (label) => ({ isHeader: true, isPhoto: false, label: label });
    const photos = [
      phHead('TODAY'),
      ph('17:40:12'), ph('17:38:55'), ph('17:22:03'), ph('16:58:41'), ph('16:57:10'), ph('12:31:48'),
      ph('12:30:02'), ph('08:14:37'), ph('08:12:20'),
      phHead('YESTERDAY'),
      ph('18:02:44'), ph('17:59:31'), ph('08:40:05')
    ];
    return {
      tabs: [mk('loop', 'Loop'), mk('photos', 'Photos'), mk('incidents', 'Incidents')],
      rows: tab === 'incidents' ? incidents : loop,
      showClips: tab !== 'photos',
      showPhotos: tab === 'photos',
      photos: photos
    };
  }
}
</script>
