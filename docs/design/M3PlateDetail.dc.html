<div class="{{theme}}" style="width: 390px; height: 844px; padding: 40px 16px 24px; display: flex; flex-direction: column; background: var(--s); color: var(--on-s); font-family: var(--font)">

<div style="display: flex; flex-direction: column; gap: 2px">

<dd style="margin: 0; font-size: 22px; line-height: 28px; font-variant-numeric: tabular-nums">17:42</dd>

<li>
<a href="M3Clip.dc.html" style="padding: 12px 12px 12px 12px; display: flex; align-items: center; gap: 14px; border-radius: {{s.radius}}; background: var(--scn); color: var(--on-s); text-decoration: none">
<span style="position: relative; width: 96px; height: 54px; flex-shrink: 0; border-radius: 12px; background: var(--schh)">
<span style="position: absolute; left: {{s.boxX}}; top: 30px; width: 24px; height: 10px; border: 2px solid var(--p); border-radius: 3px"></span>
</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="display: flex; align-items: center; gap: 8px">
<span style="font-size: 16px; line-height: 24px; letter-spacing: 0.5px; font-variant-numeric: tabular-nums">{{s.when}}</span>
<sc-if value="{{s.locked}}" hint-placeholder-val="{{ false }}">
<span style="height: 20px; padding: 0 6px; display: flex; align-items: center; border-radius: 6px; background: var(--err-c); color: var(--on-err-c); font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.5px">Incident</span>
