<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My Forthing M3 – Plate search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&family=Roboto+Mono:wght@400..600&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#000}
button,input{font:inherit;color:inherit}
input::placeholder{color:var(--on-sv);font-family:var(--font);letter-spacing:0.5px;text-transform:none}
a{color:var(--p)}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.t-blue{--p:#a9c7ff;--on-p:#07305f;--pc:#264777;--on-pc:#d6e3ff;--sc:#3e4758;--on-sc:#d9e3f9;--t:#dcbce1;--s:#111318;--on-s:#e2e2e9;--on-sv:#c4c6cf;--ol:#8e9099;--olv:#43474e;--scl:#191c20;--scn:#1d2024;--sch:#282a2f;--schh:#33353a;--inv-s:#e2e2e9;--inv-on-s:#2e3035;--err:#ffb4ab;--err-c:#93000a;--on-err-c:#ffdad6;--rec:#ffb4ab;--ok:#8fd99a;--font:'Roboto Flex',Roboto,system-ui,sans-serif;--mono:'Roboto Mono',ui-monospace,monospace}
.t-purple{--p:#cfbdfe;--on-p:#36275d;--pc:#4d3d75;--on-pc:#e9ddff;--sc:#4a4458;--on-sc:#e8def8;--t:#efb8c8;--s:#141218;--on-s:#e6e0e9;--on-sv:#cac4cf;--ol:#948f99;--olv:#49454e;--scl:#1d1b20;--scn:#211f24;--sch:#2b292f;--schh:#36343a;--inv-s:#e6e0e9;--inv-on-s:#322f35;--err:#ffb4ab;--err-c:#93000a;--on-err-c:#ffdad6;--rec:#ffb4ab;--ok:#8fd99a;--font:'Roboto Flex',Roboto,system-ui,sans-serif;--mono:'Roboto Mono',ui-monospace,monospace}
.t-green{--p:#9bd4a0;--on-p:#003915;--pc:#1c5129;--on-pc:#b7f1ba;--sc:#3a4b3a;--on-sc:#d4e8d1;--t:#a1ced7;--s:#101510;--on-s:#e0e4dc;--on-sv:#c1c9be;--ol:#8b9389;--olv:#414941;--scl:#181d18;--scn:#1c211c;--sch:#262b26;--schh:#313630;--inv-s:#e0e4dc;--inv-on-s:#2d322c;--err:#ffb4ab;--err-c:#93000a;--on-err-c:#ffdad6;--rec:#ffb4ab;--ok:#8fd99a;--font:'Roboto Flex',Roboto,system-ui,sans-serif;--mono:'Roboto Mono',ui-monospace,monospace}
.t-black{--p:#f4f5f7;--on-p:#050506;--pc:#1f2125;--on-pc:#f4f5f7;--sc:#2c2f34;--on-sc:#f4f5f7;--t:#9ea1a8;--s:#050506;--on-s:#f4f5f7;--on-sv:#9ea1a8;--ol:#5c6068;--olv:#1f2125;--scl:#0b0c0e;--scn:#0e0f11;--sch:#16181b;--schh:#1f2125;--inv-s:#f4f5f7;--inv-on-s:#050506;--err:#ff6961;--err-c:#3a1210;--on-err-c:#ff8a80;--rec:#ff453a;--ok:#30d158;--font:Geist,'Helvetica Neue',system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace}
</style>
</helmet>
<div class="{{theme}}" style="width: 390px; height: 844px; padding: 48px 16px 24px; display: flex; flex-direction: column; background: var(--s); color: var(--on-s); font-family: var(--font)">

<h1 style="margin: 0; position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Search license plates</h1>

<div style="height: 56px; display: flex; align-items: center; border-radius: 28px; background: var(--sch)">
<a href="M3Home.dc.html" aria-label="Back" style="width: 48px; height: 48px; margin-left: 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--on-s)">
<svg width="24" height="24" viewBox="0 -960 960 960" aria-hidden="true" style="fill: currentColor"><path d="m274-450 227 227q9 9 9 21t-9 21q-9 9-21 9t-21-9L181-459q-5-5-7-10t-2-11q0-6 2-11t7-10l278-278q9-9 21-9t21 9q9 9 9 21t-9 21L274-510h496q13 0 21.5 8.5T800-480q0 13-8.5 21.5T770-450H274Z"></path></svg>
</a>
<input id="plate-search" type="search" aria-label="Search license plates" autocomplete="off" placeholder="Search license plates" value="{{q}}" onChange="{{onQ}}" style="flex-grow: 1; min-width: 0; height: 56px; padding: 0 16px 0 4px; border: 0; background: transparent; font-family: var(--mono); font-size: 16px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--on-s)">
</div>

<div style="margin-top: 16px; display: flex; gap: 8px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
<button type="button" aria-pressed="{{f.on}}" onClick="{{f.pick}}" style="height: 32px; padding: 0 16px 0 {{f.pl}}; display: flex; align-items: center; gap: 8px; border-radius: 8px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px; cursor: pointer">
<sc-if value="{{f.on}}" hint-placeholder-val="{{ false }}">
<svg width="18" height="18" viewBox="0 -960 960 960" aria-hidden="true" style="fill: currentColor"><path d="m378-332 363-363q9-9 21.5-9t21.5 9q9 9 9 21.5t-9 21.5L399-267q-9 9-21 9t-21-9L175-449q-9-9-8.5-21.5T176-492q9-9 21.5-9t21.5 9l159 160Z"></path></svg>
</sc-if>
<span>{{f.label}}</span>
</button>
</sc-for>
</div>

<p style="margin: 20px 16px 8px; font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px; color: var(--p)">{{countLabel}}</p>

<sc-if value="{{hasResults}}" hint-placeholder-val="{{ true }}">
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{results}}" as="p" hint-placeholder-count="8">
<li>
<a href="M3PlateDetail.dc.html" style="min-height: 64px; padding: 8px 16px; display: flex; align-items: center; gap: 16px; border-radius: {{p.radius}}; background: var(--scn); color: var(--on-s); text-decoration: none">
<span style="min-width: 108px; display: flex">
<span style="height: 30px; padding: 0 10px; display: flex; align-items: center; border-radius: 6px; background: var(--inv-s); color: var(--inv-on-s); font-family: var(--mono); font-size: 14px; font-weight: 600; letter-spacing: 0.06em; white-space: nowrap">{{p.text}}</span>
</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<span style="display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; letter-spacing: 0.25px; color: var(--on-s)">
<span>{{p.seen}}</span>
<sc-if value="{{p.incident}}" hint-placeholder-val="{{ false }}">
<span style="height: 20px; padding: 0 6px; display: flex; align-items: center; border-radius: 6px; background: var(--err-c); color: var(--on-err-c); font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.5px">Incident</span>
</sc-if>
</span>
<span style="font-size: 12px; line-height: 16px; letter-spacing: 0.4px; color: var(--on-sv); font-variant-numeric: tabular-nums">Last {{p.last}}</span>
</span>
<svg width="24" height="24" viewBox="0 -960 960 960" aria-hidden="true" style="flex-shrink: 0; fill: var(--on-sv)"><path d="M530-481 353-658q-9-9-8.5-21t9.5-21q9-9 21.5-9t21.5 9l198 198q5 5 7 10t2 11q0 6-2 11t-7 10L396-261q-9 9-21 8.5t-21-9.5q-9-9-9-21.5t9-21.5l176-176Z"></path></svg>
</a>
</li>
</sc-for>
</ul>
</sc-if>

<sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}">
<div style="padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; border-radius: 28px; background: var(--scn); text-align: center">
<svg width="32" height="32" viewBox="0 -960 960 960" aria-hidden="true" style="fill: var(--on-sv)"><path d="M378-329q-108.16 0-183.08-75Q120-479 120-585t75-181q75-75 181.5-75t181 75Q632-691 632-584.85 632-542 618-502q-14 40-42 75l242 240q9 8.56 9 21.78T818-143q-9 9-22.22 9-13.22 0-21.78-9L533-384q-30 26-69.96 40.5Q423.08-329 378-329Zm-1-60q81.25 0 138.13-57.5Q572-504 572-585t-56.87-138.5Q458.25-781 377-781q-82.08 0-139.54 57.5Q180-666 180-585t57.46 138.5Q294.92-389 377-389Z"></path></svg>
<p style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 500; color: var(--on-s)">No plates match “{{q}}”</p>
<p style="margin: 0; font-size: 14px; line-height: 20px; letter-spacing: 0.25px; color: var(--on-sv)">Try part of the plate, like the city letters or the last digits.</p>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Material You (blue)","Material You (purple)","Material You (green)","My Forthing black"],"default":"Material You (blue)"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const T = { 'Material You (blue)': 't-blue', 'Material You (purple)': 't-purple', 'Material You (green)': 't-green', 'My Forthing black': 't-black' };
    const st = this.state || {};
    const q = st.q || '';
    const filter = st.filter || 'all';
    const norm = (s) => String(s).toUpperCase().replace(/[^A-Z0-9]/g, '');
    const all = [
      { text: 'B-MK 4821', count: 4, last: 'today 17:42', incident: true, days: 0 },
      { text: 'P-RS 1193', count: 2, last: 'today 17:42', incident: false, days: 0 },
      { text: 'B-LT 207', count: 2, last: 'today 17:41', incident: false, days: 0 },
      { text: 'HH-JK 553', count: 1, last: 'today 12:31', incident: false, days: 0 },
      { text: 'B-AE 7730', count: 6, last: 'yesterday 08:12', incident: false, days: 1 },
      { text: 'M-AB 9042', count: 1, last: '12 Sep 09:05', incident: true, days: 16 },
      { text: 'B-ZO 1586', count: 3, last: '12 Sep 08:40', incident: false, days: 16 },
      { text: 'TF-GH 64', count: 1, last: '10 Sep 18:02', incident: false, days: 18 }
    ];
    const nq = norm(q);
    const list = all
      .filter((p) => (filter === 'incidents' ? p.incident : filter === 'week' ? p.days <= 7 : true))
      .filter((p) => (nq ? norm(p.text).indexOf(nq) !== -1 : true));
    const n = list.length;
    const results = list.map((p, i) => Object.assign({}, p, {
      seen: p.count === 1 ? 'Seen once' : 'Seen ' + p.count + ' times',
      radius: n === 1 ? '20px' : i === 0 ? '20px 20px 4px 4px' : i === n - 1 ? '4px 4px 20px 20px' : '4px'
    }));
    const mk = (id, label) => {
      const on = filter === id;
      return {
        label: label,
        on: on,
        pl: on ? '8px' : '16px',
        bg: on ? 'var(--sc)' : 'transparent',
        fg: on ? 'var(--on-sc)' : 'var(--on-sv)',
        border: on ? 'var(--sc)' : 'var(--olv)',
        pick: () => this.setState({ filter: id })
      };
    };
    return {
      theme: T[this.props.theme] || 't-blue',
      q: q,
      onQ: (e) => this.setState({ q: e.target.value }),
      filters: [mk('all', 'All'), mk('incidents', 'Incidents'), mk('week', 'Last 7 days')],
      results: results,
      hasResults: n > 0,
      noResults: n === 0,
      countLabel: n === 1 ? '1 plate' : n + ' plates'
    };
  }
}
</script>
</body>
</html>
