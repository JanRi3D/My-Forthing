<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My Forthing M3 – Upscale clip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&family=Roboto+Mono:wght@400..600&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#000}
button,input{font:inherit;color:inherit}
input::placeholder{color:var(--on-sv)}
a{color:var(--p)}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.t-blue{--p:#a9c7ff;--on-p:#07305f;--pc:#264777;--on-pc:#d6e3ff;--sc:#3e4758;--on-sc:#d9e3f9;--t:#dcbce1;--s:#111318;--on-s:#e2e2e9;--on-sv:#c4c6cf;--ol:#8e9099;--olv:#43474e;--scl:#191c20;--scn:#1d2024;--sch:#282a2f;--schh:#33353a;--inv-s:#e2e2e9;--inv-on-s:#2e3035;--err:#ffb4ab;--err-c:#93000a;--on-err-c:#ffdad6;--rec:#ffb4ab;--ok:#8fd99a;--font:'Roboto Flex',Roboto,system-ui,sans-serif;--mono:'Roboto Mono',ui-monospace,monospace}
.t-purple{--p:#cfbdfe;--on-p:#36275d;--pc:#4d3d75;--on-pc:#e9ddff;--sc:#4a4458;--on-sc:#e8def8;--t:#efb8c8;--s:#141218;--on-s:#e6e0e9;--on-sv:#cac4cf;--ol:#948f99;--olv:#49454e;--scl:#1d1b20;--scn:#211f24;--sch:#2b292f;--schh:#36343a;--inv-s:#e6e0e9;--inv-on-s:#322f35;--err:#ffb4ab;--err-c:#93000a;--on-err-c:#ffdad6;--rec:#ffb4ab;--ok:#8fd99a;--font:'Roboto Flex',Roboto,system-ui,sans-serif;--mono:'Roboto Mono',ui-monospace,monospace}
.t-green{--p:#9bd4a0;--on-p:#003915;--pc:#1c5129;--on-pc:#b7f1ba;--sc:#3a4b3a;--on-sc:#d4e8d1;--t:#a1ced7;--s:#101510;--on-s:#e0e4dc;--on-sv:#c1c9be;--ol:#8b9389;--olv:#414941;--scl:#181d18;--scn:#1c211c;--sch:#262b26;--schh:#313630;--inv-s:#e0e4dc;--inv-on-s:#2d322c;--err:#ffb4ab;--err-c:#93000a;--on-err-c:#ffdad6;--rec:#ffb4ab;--ok:#8fd99a;--font:'Roboto Flex',Roboto,system-ui,sans-serif;--mono:'Roboto Mono',ui-monospace,monospace}
.t-black{--p:#f4f5f7;--on-p:#050506;--pc:#1f2125;--on-pc:#f4f5f7;--sc:#2c2f34;--on-sc:#f4f5f7;--t:#9ea1a8;--s:#050506;--on-s:#f4f5f7;--on-sv:#9ea1a8;--ol:#5c6068;--olv:#1f2125;--scl:#0b0c0e;--scn:#0e0f11;--sch:#16181b;--schh:#1f2125;--inv-s:#f4f5f7;--inv-on-s:#050506;--err:#ff6961;--err-c:#3a1210;--on-err-c:#ff8a80;--rec:#ff453a;--ok:#30d158;--font:Geist,'Helvetica Neue',system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace}
</style>
</helmet>
<div class="{{theme}}" style="width: 390px; height: 844px; padding: 40px 16px 24px; display: flex; flex-direction: column; background: var(--s); color: var(--on-s); font-family: var(--font)">

<div style="height: 64px; display: flex; align-items: center; gap: 4px">
<a href="M3Clip.dc.html" aria-label="Back to clip" style="width: 48px; height: 48px; margin-left: -12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--on-s)">
<svg width="24" height="24" viewBox="0 -960 960 960" aria-hidden="true" style="fill: currentColor"><path d="m274-450 227 227q9 9 9 21t-9 21q-9 9-21 9t-21-9L181-459q-5-5-7-10t-2-11q0-6 2-11t7-10l278-278q9-9 21-9t21 9q9 9 9 21t-9 21L274-510h496q13 0 21.5 8.5T800-480q0 13-8.5 21.5T770-450H274Z"></path></svg>
</a>
<div style="flex-grow: 1; display: flex; flex-direction: column">
<h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 400; color: var(--on-s)">Upscale clip</h1>
<span style="font-size: 12px; line-height: 16px; letter-spacing: 0.4px; color: var(--on-sv); font-variant-numeric: tabular-nums">Today 17:41 – 17:42 · 1:00 · 1080p</span>
</div>
</div>

<fieldset style="margin: 8px 0 0; padding: 0; border: 0; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<legend style="padding: 8px 16px; font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px; color: var(--p)">Output</legend>
<label for="res-1440" style="min-height: 72px; padding: 8px 16px; display: flex; align-items: center; gap: 16px; border-radius: 20px 20px 4px 4px; background: var(--scn); cursor: pointer">
<input id="res-1440" type="radio" name="res" checked="{{is1440}}" onChange="{{pick1440}}" style="width: 20px; height: 20px; margin: 0; flex-shrink: 0; accent-color: var(--p)">
<span style="flex-grow: 1; display: flex; flex-direction: column">
<span style="font-size: 16px; line-height: 24px; letter-spacing: 0.5px; color: var(--on-s)">1440p</span>
<span style="font-size: 14px; line-height: 20px; letter-spacing: 0.25px; color: var(--on-sv)">Faster · about [TIME] · about [SIZE]</span>
</span>
</label>
<label for="res-2160" style="min-height: 72px; padding: 8px 16px; display: flex; align-items: center; gap: 16px; border-radius: 4px 4px 20px 20px; background: var(--scn); cursor: pointer">
<input id="res-2160" type="radio" name="res" checked="{{is2160}}" onChange="{{pick2160}}" style="width: 20px; height: 20px; margin: 0; flex-shrink: 0; accent-color: var(--p)">
<span style="flex-grow: 1; display: flex; flex-direction: column">
<span style="font-size: 16px; line-height: 24px; letter-spacing: 0.5px; color: var(--on-s)">2160p (4K)</span>
<span style="font-size: 14px; line-height: 20px; letter-spacing: 0.25px; color: var(--on-sv)">Sharpest · about [TIME] · about [SIZE]</span>
</span>
</label>
</fieldset>

<p style="margin: 12px 16px 0; font-size: 12px; line-height: 16px; letter-spacing: 0.4px; color: var(--on-sv)">Upscaling runs on this phone. You can leave this screen; the finished clip is saved to Recordings.</p>

<sc-if value="{{showProgress}}" hint-placeholder-val="{{ false }}">
<div role="status" style="margin-top: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; border-radius: 28px; background: var(--pc); color: var(--on-pc)">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: 0.15px">{{statusText}}</span>
<span style="font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums">{{pctText}}</span>
</div>
<div style="height: 8px; display: flex; gap: 4px">
<span style="width: {{pctWidth}}; border-radius: 4px; background: var(--p)"></span>
<span style="flex-grow: 1; border-radius: 4px; background: var(--s)"></span>
</div>
</div>
</sc-if>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<sc-if value="{{idle}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{start}}" style="width: 100%; height: 56px; border: 0; border-radius: 28px; background: var(--p); color: var(--on-p); font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: 0.15px; cursor: pointer">Start upscaling</button>
</sc-if>
<sc-if value="{{running}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{cancel}}" style="width: 100%; height: 56px; border-radius: 28px; border: 1px solid var(--olv); background: transparent; color: var(--on-s); font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: 0.15px; cursor: pointer">Cancel</button>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<a href="M3Recordings.dc.html" style="height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 28px; background: var(--p); color: var(--on-p); font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: 0.15px; text-decoration: none">Open in Recordings</a>
</sc-if>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Material You (blue)","Material You (purple)","Material You (green)","My Forthing black"],"default":"Material You (blue)"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentWillUnmount() {
    clearInterval(this._i);
  }
  renderVals() {
    const T = { 'Material You (blue)': 't-blue', 'Material You (purple)': 't-purple', 'Material You (green)': 't-green', 'My Forthing black': 't-black' };
    const st = this.state || {};
    const pct = st.pct || 0;
    const running = !!st.running;
    const done = !!st.done;
    const res = st.res || '1440';
    return {
      theme: T[this.props.theme] || 't-blue',
      is1440: res === '1440',
      is2160: res === '2160',
      pick1440: () => this.setState({ res: '1440' }),
      pick2160: () => this.setState({ res: '2160' }),
      idle: !running && !done,
      running: running,
      done: done,
      showProgress: running || done,
      statusText: done ? 'Saved to Recordings' : 'Upscaling on this phone…',
      pctText: pct + '%',
      pctWidth: pct + '%',
      start: () => {
        clearInterval(this._i);
        this.setState({ running: true, done: false, pct: 0 });
        this._i = setInterval(() => {
          const next = Math.min(100, ((this.state && this.state.pct) || 0) + 5);
          if (next >= 100) {
            clearInterval(this._i);
            this.setState({ pct: 100, running: false, done: true });
          } else {
            this.setState({ pct: next });
          }
        }, 150);
      },
      cancel: () => {
        clearInterval(this._i);
        this.setState({ running: false, done: false, pct: 0 });
      }
    };
  }
}
</script>
</body>
</html>
